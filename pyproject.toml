[project]
name = "text-to-sql-engine"
version = "0.1.0"
description = "Natural language to safe, validated SQL: schema-aware prompting, AST guardrails, and a self-correction loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "John Rhed Atienza", email = "atienza.johnrhed01@gmail.com" }]
keywords = ["text-to-sql", "llm", "sqlglot", "guardrails", "fastapi", "postgres"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi==0.136.3",
    "psycopg[binary]==3.3.4",
    "sqlglot==30.11.0",
    "openai==2.41.1",
    "google-genai==3.5.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
ui = [
    "streamlit==1.67.0",
    "httpx==0.28.1",
]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.17",
    "mypy==2.1.0",
    "httpx==0.28.1",
]

[project.scripts]
text-to-sql-demo = "text_to_sql_engine.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
